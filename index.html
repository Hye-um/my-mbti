
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기 🌼</title>

  <style>
    :root {
      --cream: #fff9e9;
      --yellow: #ffdf70;
      --yellow-dark: #f3bd35;
      --brown: #59452e;
      --muted: #8c785c;
      --white: #ffffff;
      --pink: #ffe7dc;
      --green: #e5f1d8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px 50px;
      background:
        radial-gradient(circle at 10% 10%, #fff0bd 0, transparent 25%),
        radial-gradient(circle at 90% 85%, #ffe7d9 0, transparent 25%),
        var(--cream);
      color: var(--brown);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo",
                   "Noto Sans KR", sans-serif;
      font-size: 17px;
      line-height: 1.7;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 3px solid #bc8321;
      outline-offset: 4px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      padding: 20px 10px 26px;
    }

    .eyebrow {
      display: inline-block;
      padding: 5px 15px;
      border: 1px solid #f3dba0;
      border-radius: 30px;
      background: #fff4d0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 6vw, 45px);
      line-height: 1.25;
      letter-spacing: -1.5px;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    .flower {
      display: block;
      margin-bottom: 4px;
      font-size: 46px;
    }

    .panel {
      padding: 26px;
      border: 2px solid #f5e5bc;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 35px rgba(117, 86, 36, 0.08);
    }

    .section-heading {
      margin: 0 0 6px;
      font-size: 23px;
      font-weight: 800;
    }

    .section-description {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 15px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .mbti-button {
      min-height: 58px;
      padding: 10px 4px;
      border: 2px solid #f2e4c5;
      border-radius: 15px;
      background: #fffdf6;
      color: var(--brown);
      font-size: 18px;
      font-weight: 800;
      transition: transform 0.15s, background 0.15s,
                  border-color 0.15s;
    }

    .mbti-button:hover {
      transform: translateY(-2px);
      border-color: var(--yellow-dark);
      background: #fff3c8;
    }

    .mbti-button:active {
      transform: scale(0.97);
    }

    .mbti-button.selected {
      border-color: #d6a522;
      background: var(--yellow);
    }

    .hint {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    #result {
      display: none;
      margin-top: 24px;
      animation: appear 0.35s ease-out;
    }

    #result.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result-top {
      text-align: center;
      padding: 12px 0 18px;
    }

    .type-label {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 30px;
      background: var(--yellow);
      font-weight: 800;
    }

    .pokemon-emoji {
      display: flex;
      width: 180px;
      height: 180px;
      max-width: 100%;
      margin: 16px auto 10px;
      align-items: center;
      justify-content: center;
      border: 3px solid #f7e4a8;
      border-radius: 50%;
      background:
        radial-gradient(circle, #fffef7 25%, #fff0bd 100%);
      font-size: 105px;
      line-height: 1;
      box-shadow: 0 8px 24px rgba(150, 112, 37, 0.10);
    }

    .pokemon-name {
      margin: 8px 0 2px;
      font-size: clamp(28px, 6vw, 36px);
      font-weight: 900;
      letter-spacing: -1px;
    }

    .pokemon-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .info-card {
      margin-top: 14px;
      padding: 20px;
      border-radius: 20px;
    }

    .reason-card {
      background: #fff5d9;
    }

    .match-card {
      background: var(--green);
    }

    .info-title {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 900;
    }

    .info-text {
      margin: 0;
      white-space: pre-line;
      overflow-wrap: break-word;
    }

    .match-type {
      display: inline-block;
      margin: 3px 0;
      padding: 6px 14px;
      border-radius: 12px;
      background: white;
      font-size: 22px;
      font-weight: 900;
    }

    .match-note {
      margin: 4px 0 0;
      font-size: 14px;
      color: #586c45;
    }

    .reset-button {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 0;
      border-radius: 16px;
      background: var(--yellow);
      color: #503b20;
      font-size: 18px;
      font-weight: 900;
      transition: background 0.15s, transform 0.15s;
    }

    .reset-button:hover {
      background: #ffd34e;
    }

    .reset-button:active {
      transform: scale(0.98);
    }

    footer {
      padding: 25px 8px 0;
      text-align: center;
      color: #a08d70;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 12px 32px;
      }

      .panel {
        padding: 19px 14px;
        border-radius: 23px;
      }

      .mbti-grid {
        gap: 8px;
      }

      .mbti-button {
        min-height: 54px;
        font-size: 16px;
        border-radius: 12px;
      }

      .pokemon-emoji {
        width: 155px;
        height: 155px;
        font-size: 88px;
      }

      .info-card {
        padding: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="hero">
      <span class="flower" aria-hidden="true">🌼</span>
      <span class="eyebrow">MY MBTI × POKÉMON</span>
      <h1>MBTI로 포켓몬 찾기</h1>
      <p>내 성격과 닮은 포켓몬은 누구일까요?</p>
      <p>마음에 드는 MBTI를 골라 확인해 보세요! ✨</p>
    </header>

    <section class="panel" aria-labelledby="select-title">
      <h2 class="section-heading" id="select-title">
        🌷 MBTI를 선택해 주세요
      </h2>
      <p class="section-description">
        총 16가지 유형 중 하나를 눌러 보세요.
      </p>

      <div class="mbti-grid" id="mbtiGrid">
        <button class="mbti-button" data-type="ISTJ">ISTJ</button>
        <button class="mbti-button" data-type="ISFJ">ISFJ</button>
        <button class="mbti-button" data-type="INFJ">INFJ</button>
        <button class="mbti-button" data-type="INTJ">INTJ</button>

        <button class="mbti-button" data-type="ISTP">ISTP</button>
        <button class="mbti-button" data-type="ISFP">ISFP</button>
        <button class="mbti-button" data-type="INFP">INFP</button>
        <button class="mbti-button" data-type="INTP">INTP</button>

        <button class="mbti-button" data-type="ESTP">ESTP</button>
        <button class="mbti-button" data-type="ESFP">ESFP</button>
        <button class="mbti-button" data-type="ENFP">ENFP</button>
        <button class="mbti-button" data-type="ENTP">ENTP</button>

        <button class="mbti-button" data-type="ESTJ">ESTJ</button>
        <button class="mbti-button" data-type="ESFJ">ESFJ</button>
        <button class="mbti-button" data-type="ENFJ">ENFJ</button>
        <button class="mbti-button" data-type="ENTJ">ENTJ</button>
      </div>

      <p class="hint">💛 어떤 포켓몬이 나올지 기대해 주세요!</p>
    </section>

    <section id="result" class="panel" aria-live="polite"
             aria-labelledby="pokemonName" tabindex="-1">
      <div class="result-top">
        <span class="type-label" id="typeLabel">나의 MBTI</span>

        <div class="pokemon-emoji" id="pokemonEmoji"
             role="img" aria-label="포켓몬 이모지">⚡</div>

        <h2 class="pokemon-name" id="pokemonName">피카츄</h2>
        <p class="pokemon-subtitle" id="pokemonSubtitle">
          밝고 에너지 넘치는 전기 타입!
        </p>
      </div>

      <div class="info-card reason-card">
        <h3 class="info-title">💛 이 포켓몬이 어울리는 이유</h3>
        <p class="info-text" id="reason"></p>
      </div>

      <div class="info-card match-card">
        <h3 class="info-title">🍀 잘 맞는 MBTI 궁합</h3>
        <div class="match-type" id="matchType">ENFP</div>
        <p class="match-note" id="matchNote"></p>
      </div>

      <button class="reset-button" id="resetButton">
        ↩ 다시 고르기
      </button>
    </section>

    <footer>
      🌻 포켓몬과 MBTI를 재미로 연결한 성격 놀이입니다.<br>
      실제 성격이나 궁합을 과학적으로 판정하는 검사는 아니에요.
    </footer>
  </main>

  <script>
    // 각 MBTI에 어울리는 포켓몬과 추천 이유
    // 이모지는 외부 이미지 없이 표시됩니다.

    const pokemonData = {

        match: "ESFP",

        match: "ENFP",

        match: "ENFJ",

      ESTP: {

        emoji: "💪",

        match: "ISFP",

        match: "INFP",
        matchNote: "사람을 이끄는 따뜻함과 깊은 진심이 만나 서로의 꿈을 응원해요."
      },
      ENTJ: {
        pokemon: "보만다",
        emoji: "🐉",
        subtitle: "큰 꿈을 향해 나아가는 전략가",
        reason: "높은 목표를 세우고 과감하게 실행에 옮기는 추진력이 있어요.\n어려운 상황에서도 방향을 잃지 않고 앞장서는 모습이 닮았어요.",
        match: "INTP",
        matchNote: "큰 그림을 그리는 추진력과 날카로운 분석력이 서로에게 힘이 돼요."
      }

    const grid = document.getElementById("mbtiGrid");
    const result = document.getElementById("result");
    const resetButton = document.getElementById("resetButton");

    function selectMBTI(type) {
      const data = pokemonData[type];

      if (!data) return;

      // 선택된 버튼 표시
      document.querySelectorAll(".mbti-button").forEach(button => {
        const isSelected = button.dataset.type === type;
        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      });

      // 결과 표시
      document.getElementById("typeLabel").textContent =
        "나의 MBTI · " + type;

      document.getElementById("pokemonEmoji").textContent =
        data.emoji;

      document.getElementById("pokemonEmoji").setAttribute(
        "aria-label",
        data.pokemon + "을(를) 표현하는 이모지"
      );

      document.getElementById("pokemonName").textContent =
        data.pokemon;

      document.getElementById("pokemonSubtitle").textContent =
        data.subtitle;

      document.getElementById("reason").textContent =
        data.reason;

      document.getElementById("matchType").textContent =
        data.match;

      document.getElementById("matchNote").textContent =
        data.matchNote;

      result.classList.remove("show");

      // 애니메이션을 다시 실행
      void result.offsetWidth;
      result.classList.add("show");

      // 결과 위치로 부드럽게 이동
      result.scrollIntoView({
        behavior: window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches ? "auto" : "smooth",
        block: "start"
      });
    }

    function resetSelection() {
      result.classList.remove("show");

      document.querySelectorAll(".mbti-button").forEach(button => {
        button.classList.remove("selected");
        button.setAttribute("aria-pressed", "false");
      });

      document.getElementById("select-title").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    grid.addEventListener("click", function(event) {
      const button = event.target.closest(".mbti-button");

      if (!button) return;

      selectMBTI(button.dataset.type);
    });

    resetButton.addEventListener("click", resetSelection);

    // 접근성: 키보드로도 선택할 수 있도록 기본 버튼 기능 유지
    document.querySelectorAll(".mbti-button").forEach(button => {
      button.setAttribute("aria-pressed", "false");
    });
  </script>
</body>
</html>
